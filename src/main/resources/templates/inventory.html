<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h1>Inventory Management</h1>

    <table class="table table-striped">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        <tr th:each="item : ${items}">
            <td th:text="${item.name}"></td>
            <td th:text="|$ ${item.price}|"></td>
            <td th:text="${item.quantity}"></td>
            <td>
                <form th:action="@{/items/delete/{id}(id=${item.id})}" method="post">
                    <button class="btn btn-danger">Delete</button>
                </form>
            </td>
            <td>
                <a th:href="@{/items/edit/{id}(id=${item.id})}" class="btn btn-warning btn-sm">Edit</a>
            </td>
        </tr>
    </table>

    <h2>Add Item</h2>
    <form th:action="@{/items/add}" method="post">
            <input type="text" name="name" placeholder="Name"/>
            <input type="number" name="price" placeholder="Price" step="0.01"/>
            <input type="number" name="quantity" placeholder="Quantity"/>

        <button class="btn btn-primary">Add</button>
    </form>
</body>
</html>
