<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npmbootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Edit Item</h1>
    <form th:action="@{/items/edit/{id}(id=${item.id})}" method="post">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" th:value="${item.name}"/>
        </div>
        <div class="mb-3">
            <label>Price</label>
            <input type="number" name="price" class="form-control" step="0.01" th:value="${item.price}"/>
        </div>
        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" name="quantity" class="form-control" th:value="${item.quantity}"/>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/inventory" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
